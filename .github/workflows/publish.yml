# После правки words.txt озвучиваем новые слова и сохраняем mp3 в репозиторий.
# Сайт GitHub Pages пересобирается сам после этого коммита.
name: Озвучка слов

on:
  push:
    branches: [main]
    paths: ["words.txt", "tools/**", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audio
  cancel-in-progress: false

jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Озвучить новые слова
        run: |
          pip install --quiet edge-tts
          python tools/build_audio.py

      - name: Сохранить озвучку
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A audio
          if ! git diff --cached --quiet; then
            git commit -m "Озвучка обновлена"
            git pull --rebase --autostash
            git push
          fi
