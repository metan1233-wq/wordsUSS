# После правки words.txt озвучиваем новые слова и сохраняем mp3 в репозиторий.
# Сайт GitHub Pages пересобирается сам после этого коммита.
name: Озвучка слов

on:
  push:
    branches: [main]
    paths: ["words.txt", "examples.txt", "stories/**", "tools/**", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: audio
  cancel-in-progress: false

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Озвучить новые слова
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install --quiet edge-tts
          AUDIO_BUDGET_MIN=50 python tools/build_audio.py

      - name: Сохранить озвучку
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A audio
          if ! git diff --cached --quiet; then
            git commit -m "Озвучка обновлена"
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && break
              sleep 5
            done
          fi

      - name: Продолжить, если не всё успели
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f /tmp/audio-more ]; then gh workflow run publish.yml --ref main; fi
